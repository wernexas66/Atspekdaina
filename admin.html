<!DOCTYPE html>
<html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:20px auto;padding:0 12px}input,button{font:inherit;padding:10px;font-size:16px}.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ccc}.r span{flex:1;overflow:hidden;text-overflow:ellipsis}</style></head>
<body><h2>Lyderių lentelė</h2><input id="k" type="password" placeholder="Admin raktas"> <button onclick="load()">Rodyti</button><div id="o"></div>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(b){b.key=$("k").value;return fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function rows(t,l){return "<h3>"+t+"</h3>"+(l.length?l.map(function(x){return '<div class="r"><span>'+esc(x.n)+'</span><b>'+x.p+'</b><button data-n="'+esc(x.n)+'">Ištrinti</button></div>'}).join(""):"<p>Tuščia</p>")}
function show(d){if(d.error){$("o").textContent=d.error;return}$("o").innerHTML=rows("Viso",d.all)+rows("Šiandien",d.day)}
function load(){api({}).then(show)}
$("o").onclick=function(e){var b=e.target.closest("button");if(!b)return;if(confirm("Ištrinti "+b.getAttribute("data-n")+"?"))api({del:b.getAttribute("data-n")}).then(show)};
</script></body></html>
